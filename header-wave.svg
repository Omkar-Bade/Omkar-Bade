<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 220" preserveAspectRatio="none" width="1440" height="220">
  <defs>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00FFB3;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00D9FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D1117;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0a1a14;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#0d1520;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D1117;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1440" height="220" fill="url(#bgGrad)" />
  
  <!-- Subtle secondary wave (deeper, softer) -->
  <path d="M0,160 C180,120 360,180 540,140 C720,100 900,170 1080,130 C1260,90 1350,150 1440,120 L1440,220 L0,220 Z" 
        fill="url(#waveGrad)" opacity="0.15" />
  
  <!-- Main glow layer behind wave -->
  <path d="M0,140 C160,100 320,180 480,130 C640,80 800,170 960,120 C1120,70 1280,150 1440,100 L1440,220 L0,220 Z" 
        fill="url(#waveGrad)" opacity="0.25" filter="url(#softGlow)" />
  
  <!-- Primary wave -->
  <path d="M0,140 C160,100 320,180 480,130 C640,80 800,170 960,120 C1120,70 1280,150 1440,100 L1440,220 L0,220 Z" 
        fill="url(#waveGrad)" opacity="0.85" />
  
  <!-- Top accent wave (thin, subtle) -->
  <path d="M0,150 C180,110 360,185 540,138 C720,90 900,175 1080,125 C1200,90 1340,140 1440,108" 
        fill="none" stroke="url(#waveGrad)" stroke-width="1.5" opacity="0.5" />
</svg>
